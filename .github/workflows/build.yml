name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check documentation locales
        shell: pwsh
        run: ./tests/Test-DocumentationLocales.ps1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native observer, test, and package GUI
        shell: pwsh
        run: ./build/Publish.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SynapseObserver-win-x64
          path: artifacts/SynapseObserver-win-x64-*.zip
          if-no-files-found: error
